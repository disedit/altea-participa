language: php

os: osx

php:
  - 8.5

before_script:
  - cp .env.testing .env
  - composer self-update
  - composer install --prefer-source --no-interaction
  - php artisan key:generate
  - php artisan migrate
  - nvm install stable
  - npm install npm@latest -g
  - npm install

before_install:
  - mysql -e 'CREATE DATABASE wildcard_participa_tests;'

script:
  - npm run production
  - vendor/bin/phpunit

services:
  - mysql

notifications:
  email: false
